<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Memory Wallpaper</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }
    code { background:#eee; padding:2px 5px; border-radius:4px; }
    button { padding:10px 14px; cursor:pointer; }
    #status { margin-top:15px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>Memory Wallpaper</h1>
  <p>
    Browser activity is sent only to your local service at
    <code>127.0.0.1:8765</code>.
  </p>

  <button id="health">Check local service</button>
  <button id="generate">Generate wallpaper now</button>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
